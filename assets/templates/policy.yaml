# AOS project policy — gates, tiers, and verification contracts.
# Bash patterns are JavaScript regexes matched (case-insensitive) against commands.
# protected_paths patterns are globs matched against absolute and repo-relative paths.
version: 1

# auto: agent proceeds after writing plan.md
# ask:  file writes outside the run folder stay gated until the human runs `aos run approve`
plan_gate: auto

# Scope gate: when a run's plan.md has a "## Files" (or "## Scope") section,
# writes to files outside that list ask for approval — the drift that plan
# approval alone cannot catch. Self-activating: a plan that declares nothing
# gates nothing, so set this false only to switch it off where scope IS
# declared. Entries may be exact paths, directories, or globs.
scope_gate: true

# Dry run: record what every gate WOULD decide and let the tool through anyway.
# Use it to tune a policy against your real workflow before enforcing it —
# `aos status` prints the suppressed decisions and `aos doctor` FAILS while
# this is on, because a forgotten dry_run looks exactly like a healthy install.
dry_run: false

# Learnings capture: flags sessions that did substantive work but wrote no
# learnings, and the Stop hook asks the session to extract them before ending.
# Set false to turn both off (the `aos run finish` reminder is unaffected).
learnings_capture: true

# Review capture: when a session's run is sitting at awaiting-review, the Stop
# hook asks that session to present the change and propose the close before it
# ends — so the sign-off happens where the human already is, instead of waiting
# on a dashboard visit. Closing still requires their approval at the gate
# prompt. Set false to leave runs in the queue for `aos status` / the console.
review_capture: true

tiers:
  # Working-tree protection (built in, always on unless disabled here).
  # `git reset --hard`, `git clean -f`, `git checkout -- .`, `git restore`,
  # `git switch -f`, `git branch -D`, `git stash drop|clear` all destroy work
  # that is in no commit — the accident that actually happens to agents. They
  # are parsed structurally (flag clusters, `git -C .`, env prefixes) and
  # gated at `ask`, never denied. Set false if discarding the worktree is
  # routine in this repo.
  protect_worktree: true

  forbidden:
    # --force-with-lease is not matched here; it falls through to the gated git-push rule.
    # (?<=[\s'"]) also catches quoted flags ('-f') and -\w*f catches combined
    # short flags (-uf); the CLI additionally parses git invocations structurally.
    - pattern: 'push\s+[^|;&]*(--force(?!-with-lease)\b|(?<=[\s''"])-\w*f\b)'
      reason: Force-push is forbidden by policy (--force-with-lease is gated instead)
    - pattern: 'push\s+[^|;&]*\s\+\S'
      reason: Force-push via +refspec is forbidden by policy
    # rm -rf / and friends are ALSO caught structurally (flag permutations, sudo,
    # /* targets) by a built-in check — this regex is the readable baseline.
    - pattern: 'rm\s+-rf\s+(/|~)(\s|$)'
      reason: Recursive delete of root/home is forbidden by policy
  gated:
    - pattern: '\bgit\s+push\b'
      action: git-push
    - pattern: '\bgh\s+pr\s+merge\b'
      action: merge
    # Anchored to an invocation position so `cat docs/deploy.md` stays clean.
    - pattern: '(^|[;&|]\s*)(sudo\s+)?(\S*/)?deploy\b'
      action: deploy
    - pattern: '\b(npm|pnpm|yarn|make)\s+(run\s+)?deploy\b'
      action: deploy
    # Plan approval is the human's call: an agent running it hits this gate,
    # and approving the prompt IS the approval.
    # aos\.mjs also covers `node dist/aos.mjs run approve` in dev checkouts.
    - pattern: '\baos(\.mjs)?\s+run\s+approve\b'
      action: plan-approve
      reason: Plan approval is reserved for the human — approve only after reviewing plan.md
    # Closing a review works the same way: an agent (e.g. /aos-approve) reviews
    # the awaiting-review run and proposes the close; approving the prompt IS
    # your sign-off.
    - pattern: '\baos(\.mjs)?\s+run\s+state\b[^|;&]*\b(done|shipped)\b'
      action: review-close
      reason: Closing a review (done/shipped) is reserved for the human — the approval prompt is the sign-off
  # File writes are gated too. Built-in (always on): .claude/settings.json,
  # .git/hooks/, and AOS's own policy/audit/state files require approval, and
  # shell scripts being written are scanned for forbidden/gated commands.
  # Add your own globs here:
  protected_paths:
    []
    # - pattern: '.env*'
    #   decision: ask         # or: deny
    #   reason: Environment files hold secrets

verification:
  # true  — ENFORCED: `aos run finish` refuses while the run's review.json is
  #         missing, malformed, or still has an open finding (--force overrides,
  #         and the override is recorded in the audit).
  # warn  — record the review state, never block (pre-0.11 behaviour).
  # false — no adversarial review expected at all.
  # The reviewer is a skeptic subagent spawned by /aos-verify or /aos-ticket;
  # it writes runs/<run>/review.json. `aos run review` validates that file.
  adversarial_review: true
  contracts:
    # Deterministic checks that must pass before a run can reach awaiting-review.
    # Examples:
    # - name: tests
    #   command: npm test
    #   required: true
    # - name: lint
    #   command: npm run lint
    #   required: false
    []
